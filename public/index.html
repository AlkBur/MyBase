<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSL Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#1e1e1e;color:#d4d4d4;display:flex;flex-direction:column}
#toolbar{display:flex;align-items:center;gap:8px;padding:6px 16px;background:#252526;border-bottom:1px solid #3c3c3c;flex-shrink:0}
#toolbar h1{font-size:14px;font-weight:600;color:#ccc;flex:1}
#toolbar button{background:#0e639c;color:#fff;border:none;padding:6px 14px;border-radius:3px;cursor:pointer;font-size:13px;white-space:nowrap}
#toolbar button:hover{background:#1177bb}
#toolbar button:active{background:#0e5590}
#toolbar .secondary{background:#3c3c3c}
#toolbar .secondary:hover{background:#4c4c4c}
#toolbar .danger{background:#6b3030}
#toolbar .danger:hover{background:#8b4040}
#toolbar .success{background:#2d6b30}
#toolbar .success:hover{background:#3d8b40}
#toolbar select{background:#3c3c3c;color:#d4d4d4;border:1px solid #555;border-radius:3px;padding:5px 8px;font-size:13px;cursor:pointer;outline:none}
#toolbar select:hover{background:#4c4c4c}
#timer{color:#6a6a6a;font-size:11px;margin-left:auto;min-width:120px;text-align:right}
#dirty-indicator{color:#d7ba7d;font-size:12px;min-width:90px;text-align:right}
#main{display:flex;flex:1;min-height:0}
#sidebar{width:220px;flex-shrink:0;background:#252526;border-right:1px solid #3c3c3c;display:flex;flex-direction:column}
#sidebar-header{padding:8px 12px;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #3c3c3c;flex-shrink:0}
#script-list{flex:1;overflow-y:auto;padding:4px 0}
.script-item{padding:6px 12px;cursor:pointer;font-size:13px;color:#ccc;border-left:3px solid transparent}
.script-item:hover{background:#2d2d2d}
.script-item.active{background:#37373d;border-left-color:#0e639c;color:#fff}
.script-item .date{font-size:11px;color:#6a6a6a;margin-top:1px}
#workspace{flex:1;display:flex;flex-direction:column;min-width:0}
#editor-container{flex:1;min-height:0}
#output-container{flex-shrink:0;height:28%;min-height:100px;display:flex;flex-direction:column;background:#1e1e1e;border-top:1px solid #3c3c3c}
#output-header{display:flex;align-items:center;padding:2px 12px;font-size:11px;background:#252526;color:#888;border-bottom:1px solid #3c3c3c;flex-shrink:0}
#output-header span{flex:1}
#output-body{flex:1;overflow-y:auto;padding:6px 12px;font-family:'Consolas','Courier New',monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;min-height:0}
.output-line{color:#d4d4d4}
.diag-error{color:#f48771;background:#3a1d1d33;border-left:3px solid #f48771;padding:2px 6px;margin:1px 0}
.diag-warning{color:#cca700;background:#3a3a1d33;border-left:3px solid #cca700;padding:2px 6px;margin:1px 0}
.diag-info{color:#75beff;background:#1d3a4a33;border-left:3px solid #75beff;padding:2px 6px;margin:1px 0}
#error-panel{display:none;padding:6px 12px;background:#3a1d1d;color:#f48771;font-family:'Consolas','Courier New',monospace;font-size:13px;white-space:pre-wrap;border-bottom:1px solid #5a2d2d;flex-shrink:0}
.output-empty{color:#6a6a6a;font-style:italic}
</style>
</head>
<body>

<div id="toolbar">
  <h1>DSL Playground</h1>
  <button class="success" id="new-btn">+ Новый</button>
  <button id="save-btn">Сохранить</button>
  <button class="danger" id="delete-btn">Удалить</button>
  <span id="source-label" style="color:#6a6a6a;font-size:12px;display:none"></span>
  <select id="examples-select">
    <option value="">— Примеры —</option>
    <option value="hello">Приветствие</option>
    <option value="loops">Циклы</option>
    <option value="arrays">Массивы</option>
    <option value="functions">Функции</option>
    <option value="objects">Объекты</option>
  </select>
  <button id="download-btn" class="secondary">Скачать</button>
  <span id="dirty-indicator"></span>
  <span id="timer"></span>
  <button id="run-btn">Выполнить</button>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">Сценарии</div>
    <div id="script-list"></div>
  </div>
  <div id="workspace">
    <div id="editor-container"></div>
    <div id="output-container">
      <div id="error-panel"></div>
      <div id="output-header"><span>Вывод</span></div>
      <div id="output-body"><div class="output-empty">Нажмите «Выполнить» для запуска кода</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js">
</script>
<script>
(function() {
  var API_SCRIPTS = '/api/v1/scripts';
  var API_EXEC = '/api/v1/execute';

  var STARTER_CODE =
    'Сообщить("Привет мир");\n' +
    '\n' +
    'Массив = Новый Массив;\n' +
    'Массив.Добавить("Один");\n' +
    'Массив.Добавить("Два");\n' +
    '\n' +
    'Для Каждого Элемент Из Массив Цикл\n' +
    '    Сообщить(Элемент);\n' +
    'КонецЦикла;\n';

  // ---- DOM ----
  var editorEl = document.getElementById('editor-container');
  var runBtn = document.getElementById('run-btn');
  var saveBtn = document.getElementById('save-btn');
  var newBtn = document.getElementById('new-btn');
  var deleteBtn = document.getElementById('delete-btn');
  var outputBody = document.getElementById('output-body');
  var errorPanel = document.getElementById('error-panel');
  var timerEl = document.getElementById('timer');
  var dirtyIndicator = document.getElementById('dirty-indicator');
  var scriptList = document.getElementById('script-list');

  // ---- State ----
  var editor = null;
  var currentId = null;       // id сценария (null = пример или новый)
  var currentExample = null;  // имя файла примера (null = не пример)
  var scriptsCache = [];
  var dirty = false;
  var suppressDirty = false;

  // ---- Source helpers ----
  function isScript() { return currentId !== null; }
  function isExample() { return currentExample !== null; }

  // ---- Dirty helpers ----
  function setDirty(value) {
    if (suppressDirty) return;
    dirty = value;
    dirtyIndicator.textContent = dirty ? 'Изменено' : '';
    updateSaveButton();
    deleteBtn.disabled = !isScript();
  }

  function updateSaveButton() {
    if (!isScript()) {
      saveBtn.textContent = 'Сохранить как...';
      saveBtn.disabled = !dirty;
    } else {
      saveBtn.textContent = 'Сохранить';
      saveBtn.disabled = !dirty;
    }
  }

  function updateSourceLabel() {
    var el = document.getElementById('source-label');
    if (isExample()) {
      el.textContent = 'Пример: ' + currentExample;
      el.style.display = '';
    } else {
      el.style.display = 'none';
    }
  }

  function confirmIfDirty() {
    if (dirty) return confirm('Есть несохранённые изменения. Продолжить?');
    return true;
  }

  // ---- Helpers ----
  function formatDate(s) { return s ? s.slice(0, 10) : ''; }

  function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : s; }

  // ---- Scripts CRUD ----
  function loadScriptList() {
    return fetch(API_SCRIPTS)
      .then(function(r) { return r.json(); })
      .then(function(list) {
        scriptsCache = list;
        renderScriptList();
        return list;
      })
      .catch(function(err) {
        errorPanel.textContent = 'Ошибка загрузки списка: ' + err.message;
        errorPanel.style.display = 'block';
        return [];
      });
  }

  function renderScriptList() {
    var scrollPos = scriptList.scrollTop;
    scriptList.innerHTML = '';
    if (scriptsCache.length === 0) {
      scriptList.innerHTML = '<div style="padding:12px;color:#6a6a6a;font-size:12px">Нет сценариев</div>';
      return;
    }
    scriptsCache.forEach(function(s) {
      var div = document.createElement('div');
      div.className = 'script-item' + (s.id === currentId ? ' active' : '');
      var nameEl = document.createElement('div');
      nameEl.textContent = truncate(s.name || 'Без имени', 24);
      var dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = formatDate(s.updated_at);
      div.appendChild(nameEl);
      div.appendChild(dateEl);
      div.dataset.id = String(s.id);
      div.addEventListener('click', function() { openScript(s.id); });
      scriptList.appendChild(div);
    });
    scriptList.scrollTop = scrollPos;
  }

  function updateActiveItem() {
    var items = scriptList.querySelectorAll('.script-item');
    for (var i = 0; i < items.length; i++) {
      var id = items[i].dataset.id;
      items[i].classList.toggle('active', id === String(currentId));
    }
  }

  function openScript(id) {
    if (!editor) return;
    if (id === currentId && isScript()) return;
    if (!confirmIfDirty()) return;
    return fetch(API_SCRIPTS + '/' + id)
      .then(function(r) { return r.json(); })
      .then(function(s) {
        if (s.error) return;
        currentId = s.id;
        currentExample = null;
        suppressDirty = true;
        editor.setValue(s.source || '');
        suppressDirty = false;
        setDirty(false);
        updateActiveItem();
        updateSourceLabel();
        return s;
      })
      .catch(function() {});
  }

  function saveScript() {
    if (!editor) return;
    var code = editor.getValue();

    // Пример / новый → создаём сценарий
    if (!isScript()) {
      saveBtn.textContent = 'Создание...';
      fetch(API_SCRIPTS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'Новый сценарий', source: code })
      })
        .then(function(r) { return r.json(); })
        .then(function(s) {
          if (s.error) { saveBtn.textContent = 'Ошибка'; return; }
          currentId = s.id;
          currentExample = null;
          setDirty(false);
          updateSourceLabel();
          updateSaveButton();
          loadScriptList();
        })
        .catch(function() { saveBtn.textContent = 'Ошибка'; });
      return;
    }

    // Существующий сценарий — PUT
    saveBtn.textContent = 'Сохранение...';
    fetch(API_SCRIPTS + '/' + currentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: code })
    })
      .then(function(r) { return r.json(); })
      .then(function(s) {
        if (s.error) { saveBtn.textContent = 'Ошибка'; return; }
        setDirty(false);
        loadScriptList();
        updateSaveButton();
      })
      .catch(function() { saveBtn.textContent = 'Ошибка'; });
  }

  function newScript() {
    if (!editor) return;
    if (!confirmIfDirty()) return;
    saveBtn.textContent = 'Создание...';
    fetch(API_SCRIPTS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'Новый сценарий', source: STARTER_CODE })
    })
      .then(function(r) { return r.json(); })
      .then(function(s) {
        if (s.error) { saveBtn.textContent = 'Ошибка'; return; }
        currentId = s.id;
        currentExample = null;
        suppressDirty = true;
        editor.setValue(s.source || '');
        suppressDirty = false;
        setDirty(false);
        updateSourceLabel();
        updateSaveButton();
        loadScriptList();
      })
      .catch(function() { saveBtn.textContent = 'Ошибка'; });
  }

  function deleteScript() {
    if (!currentId || !editor) return;
    if (!confirm('Удалить сценарий?')) return;
    var deletedId = currentId;
    fetch(API_SCRIPTS + '/' + currentId, { method: 'DELETE' })
      .then(function() {
        currentId = null;
        currentExample = null;
        setDirty(false);
        updateSourceLabel();
        return loadScriptList();
      })
      .then(function(list) {
        var next = list.filter(function(s) { return s.id !== deletedId; })[0];
        if (next) return openScript(next.id);
        return newScript();
      })
      .catch(function() {});
  }

  // ---- Execute ----
  // ---- Examples ----
  var EXAMPLES = {
    hello: { name: 'hello.os' },
    loops: { name: 'loops.os' },
    arrays: { name: 'arrays.os' },
    functions: { name: 'functions.os' },
    objects: { name: 'objects.os' }
  };

  function loadExample(key) {
    if (!editor || !key) return;
    if (!confirmIfDirty()) return;
    var ex = EXAMPLES[key];
    if (!ex) return;
    fetch('/examples/' + ex.name)
      .then(function(r) {
        if (!r.ok) throw new Error('Пример не найден');
        return r.text();
      })
      .then(function(code) {
        currentId = null;
        currentExample = ex.name;
        suppressDirty = true;
        editor.setValue(code);
        suppressDirty = false;
        setDirty(false);
        updateActiveItem();
        updateSourceLabel();
      })
      .catch(function(err) {
        errorPanel.textContent = 'Ошибка загрузки примера: ' + err.message;
        errorPanel.style.display = 'block';
      });
  }

  function downloadScript() {
    if (!editor) return;
    var code = editor.getValue();
    var name = 'script';
    if (isScript()) {
      var s = scriptsCache.filter(function(s) { return s.id === currentId; })[0];
      if (s) name = s.name;
    } else if (isExample()) {
      name = currentExample.replace(/\.os$/, '');
    }
    var blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name.replace(/[^a-zA-Zа-яА-Я0-9_-]/g, '_') + '.os';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  function execute() {
    if (!editor) return;
    var code = editor.getValue();

    outputBody.innerHTML = '<div class="output-empty">Выполнение...</div>';
    errorPanel.style.display = 'none';
    errorPanel.textContent = '';
    timerEl.textContent = '';

    var model = editor.getModel();
    if (model) monaco.editor.setModelMarkers(model, 'dsl', []);

    runBtn.disabled = true;
    runBtn.textContent = 'Выполнение...';
    var tStart = performance.now();

    fetch(API_EXEC, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var elapsed = Math.round(performance.now() - tStart);

      outputBody.innerHTML = '';
      if (data.output && data.output.length > 0) {
        data.output.forEach(function(line) {
          var div = document.createElement('div');
          div.className = 'output-line';
          div.textContent = line;
          outputBody.appendChild(div);
        });
      } else {
        outputBody.innerHTML = '<div class="output-empty">(пустой вывод)</div>';
      }

      if (!data.success && data.error) {
        errorPanel.textContent = 'Ошибка: ' + data.error.message;
        errorPanel.style.display = 'block';
      }

      var diags = data.diagnostics || [];
      if (diags.length > 0) {
        var markerData = [];
        diags.forEach(function(d) {
          var div = document.createElement('div');
          div.className = 'diag-' + d.severity;
          var msg = d.severity.toUpperCase() + ': ' + d.message;
          if (d.line != null) msg += ' (строка ' + d.line + ')';
          div.textContent = msg;
          outputBody.appendChild(div);
          if (d.line != null) {
            markerData.push({
              severity: d.severity === 'error' ? monaco.MarkerSeverity.Error
                       : d.severity === 'warning' ? monaco.MarkerSeverity.Warning
                       : monaco.MarkerSeverity.Info,
              message: d.message,
              startLineNumber: d.line,
              startColumn: d.column || 1,
              endLineNumber: d.line,
              endColumn: (d.column || 1) + 1
            });
          }
        });
        if (markerData.length > 0) monaco.editor.setModelMarkers(model, 'dsl', markerData);
      }

      timerEl.textContent = data.timings
        ? data.timings.compileMs + 'ms / ' + data.timings.executeMs + 'ms'
        : elapsed + 'ms';
    })
    .catch(function(err) {
      outputBody.innerHTML = '';
      errorPanel.textContent = 'Сетевая ошибка: ' + err.message;
      errorPanel.style.display = 'block';
      timerEl.textContent = '';
    })
    .finally(function() {
      runBtn.disabled = false;
      runBtn.textContent = 'Выполнить';
    });
  }

  // ---- Init ----
  var MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs';
  require.config({ paths: { vs: MONACO_BASE } });

  require(['vs/editor/editor.main'], function() {
    editor = monaco.editor.create(editorEl, {
      value: STARTER_CODE,
      language: 'plaintext',
      theme: 'vs-dark',
      fontSize: 14,
      fontFamily: 'Consolas, "Courier New", monospace',
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      tabSize: 4,
      insertSpaces: true,
      folding: false,
      lineDecorationsWidth: 8,
      lineNumbersMinChars: 3,
      padding: { top: 8 }
    });

    editor.onDidChangeModelContent(function() {
      setDirty(true);
    });

    // Keyboard shortcuts
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, execute);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveScript);

    // Buttons
    runBtn.addEventListener('click', execute);
    saveBtn.addEventListener('click', saveScript);
    newBtn.addEventListener('click', newScript);
    deleteBtn.addEventListener('click', deleteScript);

    // Examples
    document.getElementById('download-btn').addEventListener('click', downloadScript);
    document.getElementById('examples-select').addEventListener('change', function(e) {
      loadExample(e.target.value);
      e.target.value = '';
    });

    setDirty(false);
    updateSourceLabel();
    loadScriptList().then(function(list) {
      if (list.length > 0) openScript(list[0].id);
      else newScript();
    });
  });
})();
</script>
</body>
</html>
