<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSL Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#1e1e1e;color:#d4d4d4;display:flex;flex-direction:column}
#toolbar{display:flex;align-items:center;gap:8px;padding:6px 16px;background:#252526;border-bottom:1px solid #3c3c3c;flex-shrink:0}
#toolbar h1{font-size:14px;font-weight:600;color:#ccc;flex:1}
#run-btn{background:#0e639c;color:#fff;border:none;padding:6px 20px;border-radius:3px;cursor:pointer;font-size:13px;white-space:nowrap}
#run-btn:hover{background:#1177bb}
#run-btn:active{background:#0e5590}
#editor-container{flex:1;min-height:0}
#output-container{flex-shrink:0;height:30%;min-height:120px;display:flex;flex-direction:column;background:#1e1e1e;border-top:1px solid #3c3c3c}
#output-header{display:flex;align-items:center;padding:3px 16px;font-size:12px;background:#252526;color:#888;border-bottom:1px solid #3c3c3c;flex-shrink:0}
#output-header span{flex:1}
#output-body{flex:1;overflow-y:auto;padding:8px 16px;font-family:'Consolas','Courier New',monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;min-height:0}
.output-line{color:#d4d4d4}
.error-line{color:#f48771}
.diag-error{color:#f48771;background:#3a1d1d33;border-left:3px solid #f48771;padding:2px 8px;margin:2px 0}
.diag-warning{color:#cca700;background:#3a3a1d33;border-left:3px solid #cca700;padding:2px 8px;margin:2px 0}
.diag-info{color:#75beff;background:#1d3a4a33;border-left:3px solid #75beff;padding:2px 8px;margin:2px 0}
#error-panel{display:none;padding:8px 16px;background:#3a1d1d;color:#f48771;font-family:'Consolas','Courier New',monospace;font-size:13px;white-space:pre-wrap;border-bottom:1px solid #5a2d2d;flex-shrink:0}
#timer{color:#6a6a6a;font-size:11px;margin-left:auto}
.output-empty{color:#6a6a6a;font-style:italic}
</style>
</head>
<body>

<div id="toolbar">
  <h1>DSL Playground</h1>
  <span id="timer"></span>
  <button id="run-btn">Выполнить</button>
</div>

<div id="editor-container"></div>

<div id="output-container">
  <div id="error-panel"></div>
  <div id="output-header">
    <span>Вывод</span>
  </div>
  <div id="output-body">
    <div class="output-empty">Нажмите «Выполнить» для запуска кода</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js">
</script>
<script>
(function() {
  // ---- Constants ----
  var LS_KEY = 'dsl:last-code';
  var API_URL = '/api/v1/execute';

  // ---- Starter example ----
  var STARTER_CODE = 
    'Сообщить("Привет мир");\n' +
    '\n' +
    'Массив = Новый Массив;\n' +
    'Массив.Добавить("Один");\n' +
    'Массив.Добавить("Два");\n' +
    '\n' +
    'Для Каждого Элемент Из Массив Цикл\n' +
    '    Сообщить(Элемент);\n' +
    'КонецЦикла;\n';

  // ---- DOM refs ----
  var editorEl = document.getElementById('editor-container');
  var runBtn = document.getElementById('run-btn');
  var outputBody = document.getElementById('output-body');
  var errorPanel = document.getElementById('error-panel');
  var timerEl = document.getElementById('timer');

  // ---- State ----
  var editor = null;
  var saveTimer = null;

  // ---- localStorage debounce ----
  function scheduleSave(code) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() {
      try { localStorage.setItem(LS_KEY, code); } catch(e) {}
    }, 500);
  }

  // ---- Execute ----
  function execute() {
    if (!editor) return;

    var code = editor.getValue();
    scheduleSave(code);

    // Clear previous results
    outputBody.innerHTML = '<div class="output-empty">Выполнение...</div>';
    errorPanel.style.display = 'none';
    errorPanel.textContent = '';
    timerEl.textContent = '';

    // Reset Monaco markers
    var model = editor.getModel();
    if (model) {
      monaco.editor.setModelMarkers(model, 'dsl', []);
    }

    // Disable button during execution
    runBtn.disabled = true;
    runBtn.textContent = 'Выполнение...';

    var tStart = performance.now();

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var elapsed = Math.round(performance.now() - tStart);

      // Output
      outputBody.innerHTML = '';
      if (data.output && data.output.length > 0) {
        data.output.forEach(function(line) {
          var div = document.createElement('div');
          div.className = 'output-line';
          div.textContent = line;
          outputBody.appendChild(div);
        });
      } else {
        outputBody.innerHTML = '<div class="output-empty">(пустой вывод)</div>';
      }

      // Error
      if (!data.success && data.error) {
        errorPanel.textContent = 'Ошибка: ' + data.error.message;
        if (data.error.stack) {
          errorPanel.textContent += '\n' + data.error.stack;
        }
        errorPanel.style.display = 'block';
      }

      // Diagnostics
      var diags = data.diagnostics || [];
      if (diags.length > 0) {
        var markerData = [];
        diags.forEach(function(d) {
          var cls = 'diag-' + d.severity;
          var div = document.createElement('div');
          div.className = cls;
          var msg = (d.severity.toUpperCase()) + ': ' + d.message;
          if (d.line != null) msg += ' (строка ' + d.line + ')';
          div.textContent = msg;
          outputBody.appendChild(div);

          // Monaco marker
          if (d.line != null && d.column != null) {
            markerData.push({
              severity: d.severity === 'error' ? monaco.MarkerSeverity.Error
                       : d.severity === 'warning' ? monaco.MarkerSeverity.Warning
                       : monaco.MarkerSeverity.Info,
              message: d.message,
              startLineNumber: d.line,
              startColumn: d.column,
              endLineNumber: d.line,
              endColumn: d.column + 1
            });
          } else if (d.line != null) {
            markerData.push({
              severity: d.severity === 'error' ? monaco.MarkerSeverity.Error
                       : d.severity === 'warning' ? monaco.MarkerSeverity.Warning
                       : monaco.MarkerSeverity.Info,
              message: d.message,
              startLineNumber: d.line,
              startColumn: 1,
              endLineNumber: d.line,
              endColumn: 1
            });
          }
        });

        if (markerData.length > 0) {
          monaco.editor.setModelMarkers(model, 'dsl', markerData);
        }
      }

      // Timing
      if (data.timings) {
        timerEl.textContent = data.timings.compileMs + 'ms compile / ' + data.timings.executeMs + 'ms execute';
      } else {
        timerEl.textContent = elapsed + 'ms';
      }
    })
    .catch(function(err) {
      outputBody.innerHTML = '';
      errorPanel.textContent = 'Сетевая ошибка: ' + err.message;
      errorPanel.style.display = 'block';
      timerEl.textContent = '';
    })
    .finally(function() {
      runBtn.disabled = false;
      runBtn.textContent = 'Выполнить';
    });
  }

  // ---- Init Monaco ----
  var MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs';

  require.config({
    paths: { vs: MONACO_BASE }
  });

  require(['vs/editor/editor.main'], function() {
    // Load saved code or starter
    var savedCode = '';
    try { savedCode = localStorage.getItem(LS_KEY) || ''; } catch(e) {}
    if (!savedCode) savedCode = STARTER_CODE;

    editor = monaco.editor.create(editorEl, {
      value: savedCode,
      language: 'plaintext',
      theme: 'vs-dark',
      fontSize: 14,
      fontFamily: 'Consolas, "Courier New", monospace',
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      renderWhitespace: 'selection',
      tabSize: 4,
      insertSpaces: true,
      lineNumbers: 'on',
      glyphMargin: false,
      folding: false,
      lineDecorationsWidth: 8,
      lineNumbersMinChars: 3,
      padding: { top: 8 }
    });

    // Auto-save on change
    editor.onDidChangeModelContent(function() {
      scheduleSave(editor.getValue());
    });

    // Ctrl+Enter
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, execute);

    // Button
    runBtn.addEventListener('click', execute);
  });
})();
</script>
</body>
</html>
